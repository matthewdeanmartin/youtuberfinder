name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-pages.yml"
      - "content/**"
      - "data/**"
      - "static/**"
      - "themes/**"
      - "scripts/**"
      - "pipeline/**"
      - "generate_pages.py"
      - "generate_review_stubs.py"
      - "pelicanconf.py"
      - "publishconf.py"
      - "pyproject.toml"
      - "uv.lock"
      - "package.json"
      - "package-lock.json"

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Install Node dependencies
        run: npm ci

      - name: Generate pages from data
        run: uv run python generate_pages.py

      - name: Build production site
        run: uv run pelican content -o output -s publishconf.py

      - name: Copy hand-crafted static pages into output
        # static/ holds pages with complex client-side JS (e.g. the PKCE Mastodon
        # follow tool) that are not Pelican content.  publishconf.py sets
        # DELETE_OUTPUT_DIRECTORY=True, so we must copy these AFTER Pelican runs.
        # {{SITEURL}} placeholders in HTML are substituted with the production base
        # URL so CSS and nav links resolve correctly under the /youtuberfinder/ prefix.
        run: uv run python scripts/copy_static.py /youtuberfinder

      - name: Run Python quality gates
        run: |
          uv run python scripts/check_pelican_artifacts.py --site-dir output --siteurl /youtuberfinder
          uv run python scripts/check_links.py --site-dir output --internal-only --siteurl /youtuberfinder

      - name: Run Node quality gates
        run: npm run quality

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
